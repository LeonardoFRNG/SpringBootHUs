# Nombre de la aplicación
spring.application.name=eventify

# Configuración de persistencia H2 en archivo de disco local
spring.datasource.url=jdbc:h2:file:./data/eventifydb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola web de H2 para inspeccionar tablas visualmente
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate / JPA
# update: crea o actualiza las tablas sin borrar los registros existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivamos el Seeder por defecto para no duplicar datos en cada reinicio
eventify.seeder.enabled=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html