# Nombre de la aplicación
spring.application.name=eventify

# Configuración de persistencia H2 en archivo de disco local
spring.datasource.url=jdbc:h2:file:./data/eventifydb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola web de H2 para inspeccionar tablas visualmente
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway: Gestión versionada de migraciones SQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate / JPA: Validación estricta del esquema generado por Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Auditoría SQL detallada para inspección de queries y bind de parámetros en desarrollo
# NOTA DE SEGURIDAD: En entornos productivos, estos niveles deben restringirse a WARN/INFO
# para evitar fuga de datos sensibles y sobrecarga de I/O.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Desactivamos el Seeder programático para utilizar las migraciones deterministas de Flyway (V3)
eventify.seeder.enabled=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
# Documentación OpenAPI sobre rutas REST (/api/**)
springdoc.paths-to-match=/api/**
