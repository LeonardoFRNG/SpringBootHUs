<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Eventify - Panel Administrativo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand-gradient {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 1.5rem;
        }
        .main-content {
            flex: 1;
        }
        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            background: #ffffff;
            overflow: hidden;
        }
        .card-custom-header {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 1.25rem 1.5rem;
        }
        .btn-gradient-primary {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
        }
        .btn-gradient-primary:hover {
            opacity: 0.95;
            color: #ffffff;
        }
        .footer-custom {
            background-color: #0f172a;
            color: #94a3b8;
            padding: 1.5rem 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Fragment: Navbar -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/admin}">
                <i class="bi bi-calendar-event text-primary fs-4"></i>
                <span class="navbar-brand-gradient">Eventify</span>
                <span class="badge bg-primary-subtle text-primary ms-1">Admin</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar" aria-controls="adminNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin}">
                            <i class="bi bi-speedometer2 me-1"></i> Panel Principal
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/events/new}">
                            <i class="bi bi-plus-circle me-1"></i> Nuevo Evento
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/venues/new}">
                            <i class="bi bi-geo-alt me-1"></i> Nuevo Lugar
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/swagger-ui.html}" target="_blank" class="btn btn-outline-info btn-sm">
                        <i class="bi bi-file-earmark-code me-1"></i> Swagger API Docs
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Fragment: Alerts -->
    <div th:fragment="alerts" class="container mt-3">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill fs-5"></i>
            <div th:text="${successMessage}">Operación realizada exitosamente.</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
            <div th:text="${errorMessage}">Ocurrió un error.</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- Fragment: Footer -->
    <footer th:fragment="footer" class="footer-custom mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Eventify - Panel Administrativo Visual de Gestión de Eventos y Venues</p>
            <small class="text-secondary">Diseñado con Spring Boot MVC &amp; Thymeleaf</small>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </footer>

</body>
</html>
